pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
			// Only Fabric artifacts from here: its mirror of asm/gson POMs is sometimes broken and fails the build.
			content {
				includeGroupByRegex 'net\\.fabricmc.*'
				includeGroup 'fabric-loom'
			}
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'scubadive'
