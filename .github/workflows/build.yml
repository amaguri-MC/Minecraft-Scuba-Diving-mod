# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: probe apis
        run: |
          D=~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft
          CJ=$(ls $D/minecraft-clientonly-deobf/26.2/*.jar); MJ=$(ls $D/minecraft-common-deobf/26.2/*.jar)
          FJ=$(find ~/.gradle -name "fabric-*.jar" | grep -v sources | tr '\n' ':')
          CP="$CJ:$MJ:$FJ"
          for j in $(echo $FJ | tr ':' ' '); do unzip -l "$j" | awk '{print $4}' | grep -iE "rendering/v1/.*class$" ; done | sort -u
          for c in net.minecraft.client.color.block.BlockTintSource net.minecraft.client.color.block.BlockTintSources net.minecraft.client.renderer.block.BlockAndTintGetter; do echo "##### $c"; javap -cp "$CP" "$c" || true; done
          echo "##### BlockColors code"; javap -p -c -cp "$CP" net.minecraft.client.color.block.BlockColors | sed -n '/createDefault()/,/^$/p' | head -60
          echo "##### who calls createDefault"; for c in net.minecraft.client.Minecraft; do javap -p -c -cp "$CP" $c | grep -n "BlockColors" ; done
          unzip -p "$CJ" assets/minecraft/models/block/tinted_cross.json; unzip -p "$CJ" assets/minecraft/items/short_grass.json; unzip -p "$CJ" assets/minecraft/models/block/seagrass.json; unzip -p "$CJ" assets/minecraft/models/block/tall_seagrass_top.json
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: publish jar to builds branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir out && cp build/libs/scubadive-*[0-9].jar out/ && cd out
          git init -q -b builds && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" builds
