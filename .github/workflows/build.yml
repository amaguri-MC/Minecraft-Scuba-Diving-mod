# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: probe data (temporary)
        if: always()
        run: |
          MJ=$(ls ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-common-deobf/26.2/*.jar)
          for f in data/minecraft/advancement/recipes/combat/leather_boots.json data/minecraft/advancement/recipes/tools/clock.json; do echo "### $f"; unzip -p "$MJ" "$f"; echo; done
          unzip -Z1 "$MJ" | grep -E "^data/minecraft/(dimension|worldgen/world_preset|worldgen/flat_level_generator_preset)/" | head -20
          for f in data/minecraft/worldgen/flat_level_generator_preset/water_world.json data/minecraft/worldgen/world_preset/flat.json data/minecraft/dimension_type/overworld.json; do echo "### $f"; unzip -p "$MJ" "$f"; echo; done
          unzip -Z1 "$MJ" | grep -E "^data/minecraft/(structure|worldgen/structure|worldgen/template_pool|worldgen/structure_set)/" | grep -i "village/plains/houses\|shipwreck\|igloo" | head -8
          for f in data/minecraft/worldgen/structure/igloo.json data/minecraft/worldgen/structure_set/igloos.json; do echo "### $f"; unzip -p "$MJ" "$f"; echo; done
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: publish jar to builds branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir out && cp build/libs/scubadive-*[0-9].jar out/ && cd out
          git init -q -b builds && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" builds
