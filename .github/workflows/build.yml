# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: probe apis
        run: |
          D=~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft
          CJ=$(ls $D/minecraft-clientonly-deobf/26.2/*.jar); MJ=$(ls $D/minecraft-common-deobf/26.2/*.jar)
          FJ=$(find ~/.gradle -name "fabric-*.jar" | grep -v sources | tr '\n' ':')
          CP="$CJ:$MJ:$FJ"
          echo "##### color classes"; unzip -l "$CJ" | awk '{print $4}' | grep -iE "color|tint" | grep -v '\$' 
          echo "##### fabric color classes"; for j in $(echo $FJ | tr ':' ' '); do unzip -l "$j" | awk '{print $4}' | grep -iE "color|tint" ; done | sort -u
          for c in net.minecraft.client.color.block.BlockColors net.fabricmc.fabric.api.event.client.player.ClientHotbarScrollEvents 'net.fabricmc.fabric.api.event.client.player.ClientHotbarScrollEvents$Allow' net.minecraft.client.gui.GuiGraphicsExtractor; do echo "##### $c"; javap -cp "$CP" "$c" || true; done
          echo "##### RenderPipelines GUI"; javap -cp "$CP" net.minecraft.client.renderer.RenderPipelines | grep -i gui
          echo "##### Camera code"; javap -p -c -cp "$CP" net.minecraft.client.Camera | sed -n '/getFov()/,/^$/p;/calculateFov(float)/,/^$/p;/void tickFov()/,/^$/p'
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: publish jar to builds branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir out && cp build/libs/scubadive-*[0-9].jar out/ && cd out
          git init -q -b builds && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" builds
