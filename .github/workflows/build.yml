# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: probe recipes
        run: |
          MJ=$(ls ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-common-deobf/26.2/*.jar)
          unzip -Z1 "$MJ" | grep -i "data/minecraft/recipe/" | grep -iE "dye|leather_boots|clock" | head -40
          for f in $(unzip -Z1 "$MJ" | grep -iE "data/minecraft/recipe/(leather_boots|clock|.*dye.*leather.*|dye_.*|.*armor_dye.*)\.json" | head -6); do echo "### $f"; unzip -p "$MJ" "$f"; done
          echo "### dyeable tag"; unzip -p "$MJ" data/minecraft/tags/item/dyeable.json || true
          unzip -Z1 "$MJ" | grep -i "tags/item" | grep -i dye
