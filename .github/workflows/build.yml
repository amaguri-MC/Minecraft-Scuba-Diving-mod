# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: probe apis
        if: always()
        run: |
          MC=$(find ~/.gradle .gradle -name "*.jar" 2>/dev/null | grep -i minecraft | grep -iv sources | sort)
          echo "$MC"
          CP=$(echo "$MC" | tr '\n' ':')
          FAPI=$(find ~/.gradle -name "fabric-*.jar" | grep -v sources | tr '\n' ':')
          for c in net.minecraft.client.gui.screens.Screen net.minecraft.client.gui.GuiGraphicsExtractor net.minecraft.client.renderer.GameRenderer net.minecraft.client.MouseHandler net.minecraft.client.renderer.entity.LivingEntityRenderer net.minecraft.client.renderer.RenderPipelines net.minecraft.client.player.AbstractClientPlayer net.minecraft.client.Camera net.minecraft.client.gui.Hud net.minecraft.client.renderer.state.gui.GuiRenderState; do
            echo "##### $c"; javap -p -cp "$CP" $c || true
          done
          for j in $(find ~/.gradle -name "fabric-*.jar" | grep -v sources); do unzip -l "$j" | grep -iE "fov|scroll|mouse|zoom" ; done | awk '{print $4}' | sort -u
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: publish jar to builds branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir out && cp build/libs/scubadive-*[0-9].jar out/ && cd out
          git init -q -b builds && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" builds
