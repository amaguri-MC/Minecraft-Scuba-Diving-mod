# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: dump apis
        run: |
          D=~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft
          CJ=$(ls $D/minecraft-clientonly-deobf/26.2/*.jar); MJ=$(ls $D/minecraft-common-deobf/26.2/*.jar)
          FJ=$(find ~/.gradle -name "fabric-*.jar" | grep -v sources | grep -v loader | sort -u)
          CP="$CJ:$MJ:$(echo $FJ | tr ' ' ':')"
          mkdir -p out/mc out/fabric out/data
          dumpjar() { unzip -Z1 "$1" | grep '\.class$' | grep -v 'module-info' | sed 's/\.class$//; s#/#.#g' > /tmp/cls.txt; split -l 400 /tmp/cls.txt /tmp/chunk_; for f in /tmp/chunk_*; do javap -p -cp "$CP" $(cat $f) 2>/dev/null; done; rm -f /tmp/chunk_*; }
          dumpjar "$CJ" > out/mc/client.txt
          dumpjar "$MJ" > out/mc/common.txt
          for j in $FJ; do dumpjar "$j"; done > out/fabric/fabric.txt
          (cd out/data && unzip -qo "$MJ" 'data/minecraft/worldgen/*' 'data/minecraft/tags/*' 'data/minecraft/dimension_type/*' -x '*.nbt' || true)
          (cd out/data && unzip -qo "$CJ" 'assets/minecraft/models/*' 'assets/minecraft/items/*' 'assets/minecraft/equipment/*' 'assets/minecraft/blockstates/*' 'assets/minecraft/particles/*' || true)
          du -sh out/*
          cd out && git init -q -b apidump && git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm dump
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" apidump
