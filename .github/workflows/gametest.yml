name: client-gametest
on:
  push:
    branches-ignore: [builds]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client_gametest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri
      - run: chmod +x ./gradlew && mkdir -p run && echo "eula=true" > run/eula.txt
      - name: run client game test
        timeout-minutes: 22
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace 2>&1 | tee gametest.log; exit ${PIPESTATUS[0]}
        shell: bash
      - if: always()
        run: grep -h "SCUBA_TEST\|Exception\|AssertionError\|Can't keep up" gametest.log run/logs/latest.log > summary.txt || true; cat summary.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gametest
          path: |
            run/screenshots
            run/logs/latest.log
            gametest.log
            summary.txt
      - name: publish results to gametest-out branch
        if: always()
        shell: bash
        run: |
          mkdir out && cp -r run/screenshots out/ 2>/dev/null || true
          cp summary.txt out/ 2>/dev/null || true
          cp run/logs/latest.log out/ 2>/dev/null || true
          cd out && git init -q -b gametest-out && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "gametest ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" gametest-out
